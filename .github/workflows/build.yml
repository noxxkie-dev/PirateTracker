
name: Build Pirate Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o PirateTrackerAndroid-Source.zip -d .

      - name: Build APK
        run: gradle -p PirateTrackerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PirateTracker-APK
          path: PirateTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
